<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>レート表シート | KOKO HOTEL Premier 熊本</title>
    <style>
      body{margin:0;font-family:"Noto Sans JP",sans-serif;background:#f4f8ff;color:#223456}
      .wrap{max-width:980px;margin:0 auto;padding:18px}.card{background:#fff;border:1px solid #d8e5fa;border-radius:16px;box-shadow:0 8px 20px rgba(27,50,102,.08)}
      .head{padding:16px 18px 8px;display:flex;justify-content:space-between;align-items:center}.head h1{margin:0;font-size:1.4rem}.body{padding:12px 18px 18px}
      .meta{margin:8px 0;border:1px solid #d9e6ff;background:#f7fbff;border-radius:10px;padding:10px 12px;color:#3b5685}
      .actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:none;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.btn.primary{background:#1f6feb;color:#fff}.btn.soft{background:#e8f1ff;color:#2f528f}
      table{width:100%;border-collapse:collapse;border:2px solid #c4d6f6}th,td{border:1px solid #cfdcf6;padding:9px 8px;text-align:left}th{background:#eef4ff;color:#4c6793}
      @page{size:A4 portrait;margin:11mm}@media print{.actions{display:none}.card{box-shadow:none;border:none}}
    </style>
  </head>
  <body>
    <main class="wrap">
      <article class="card">
        <div class="head">
          <h1>レート表シート（翌日05:00から12時間）</h1>
          <div class="actions"><button id="reloadBtn" class="btn soft" type="button">再読み込み</button><button id="printBtn" class="btn primary" type="button">A4で印刷</button></div>
        </div>
        <div class="body">
          <div id="meta" class="meta">計算データがありません。料金計算ページで先に「料金計算」を押してください。</div>
          <table>
            <thead><tr><th>出庫時刻</th><th>通常料金</th></tr></thead>
            <tbody id="sheetBody"><tr><td colspan="2">未生成です。</td></tr></tbody>
          </table>
        </div>
      </article>
    </main>

    <script>
      const STORAGE_KEY = "kokoParkingToolV8";
      const LAST_CALC_KEY = "kokoParkingLastCalcV1";
      const byId = (id) => document.getElementById(id);
      const num = (v, d = 0) => Number.isFinite(Number(v)) ? Number(v) : d;
      const yen = (v) => new Intl.NumberFormat("ja-JP", { style: "currency", currency: "JPY", maximumFractionDigits: 0 }).format(v);
      const pad = (v) => String(v).padStart(2, "0");
      const fmt = (dt) => `${dt.getMonth() + 1}/${dt.getDate()} ${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
      const dateKey = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

      function loadState(){
        const raw = localStorage.getItem(STORAGE_KEY);
        if(!raw) return null;
        try{return JSON.parse(raw);}catch{return null;}
      }
      function loadLast(){
        const raw = localStorage.getItem(LAST_CALC_KEY);
        if(!raw) return null;
        try{return JSON.parse(raw);}catch{return null;}
      }

      function nthWeekdayOfMonth(year, month, weekday, nth){const first=new Date(year,month-1,1);return 1+((7+weekday-first.getDay())%7)+(nth-1)*7}
      function springEquinoxDay(year){return Math.floor(20.8431+0.242194*(year-1980)-Math.floor((year-1980)/4))}
      function autumnEquinoxDay(year){return Math.floor(23.2488+0.242194*(year-1980)-Math.floor((year-1980)/4))}
      function holidaySet(year){const h=new Set();const add=(m,d)=>h.add(`${year}-${pad(m)}-${pad(d)}`);add(1,1);add(2,11);add(2,23);add(4,29);add(5,3);add(5,4);add(5,5);add(8,11);add(11,3);add(11,23);add(3,springEquinoxDay(year));add(9,autumnEquinoxDay(year));add(1,nthWeekdayOfMonth(year,1,1,2));add(7,nthWeekdayOfMonth(year,7,1,3));add(9,nthWeekdayOfMonth(year,9,1,3));add(10,nthWeekdayOfMonth(year,10,1,2));return h}
      const dayType = (d) => holidaySet(d.getFullYear()).has(dateKey(d)) ? "holiday" : (d.getDay()===0||d.getDay()===6 ? "weekend" : "weekday");

      function calcDayFee(minutes, r){if(minutes<=0)return 0;if(minutes<=r.firstMinutes)return Math.min(r.firstFee,r.dayMax);return Math.min(r.firstFee+Math.ceil((minutes-r.firstMinutes)/Math.max(1,r.afterMinutes))*r.afterFee,r.dayMax)}
      function calcNightFee(minutes, r){if(minutes<=0)return 0;return Math.min(Math.ceil(minutes/Math.max(1,r.nightMinutes))*r.nightFee,r.nightMax)}
      function calcNormalFee(lot, entry, exit){const buckets={},cur=new Date(entry);while(cur<exit){const next=new Date(Math.min(cur.getTime()+60000,exit.getTime()));const type=dayType(cur),r=lot[type],h=cur.getHours()+cur.getMinutes()/60,isDay=h>=r.dayStart&&h<r.dayEnd;const k=`${dateKey(cur)}-${type}`;if(!buckets[k])buckets[k]={type,day:0,night:0};if(isDay)buckets[k].day+=1;else buckets[k].night+=1;cur.setTime(next.getTime())}let total=0;Object.values(buckets).forEach((b)=>{const r=lot[b.type];total+=calcDayFee(b.day,r)+calcNightFee(b.night,r)});return total}

      function render(){
        const state = loadState();
        const last = loadLast();
        if(!state || !last){byId('meta').textContent='計算データがありません。料金計算ページで先に「料金計算」を押してください。';return;}
        const lot = state.lots.find((l)=>l.id===last.lotId);
        if(!lot){byId('meta').textContent='駐車場設定が見つかりません。';return;}
        const entry = new Date(last.entry);
        if(Number.isNaN(entry.getTime())){byId('meta').textContent='入庫日時データが不正です。';return;}

        const start = new Date(entry); start.setDate(start.getDate()+1); start.setHours(5,0,0,0);
        const end = new Date(start.getTime()+12*60*60000);
        let html='';
        for(let t=new Date(start); t<=end; t=new Date(t.getTime()+30*60000)){
          html += `<tr><td>${fmt(t)}</td><td>${yen(calcNormalFee(lot, entry, t))}</td></tr>`;
        }
        byId('sheetBody').innerHTML=html;
        byId('meta').textContent=`${lot.name} / 入庫 ${fmt(entry)} / ${fmt(start)}〜${fmt(end)}（30分刻み）`;
      }

      byId('reloadBtn').addEventListener('click', render);
      byId('printBtn').addEventListener('click', ()=>window.print());
      render();
    </script>
  </body>
</html>
