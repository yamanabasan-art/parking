<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KOKO HOTEL Premier 熊本 駐車場料金ツール</title>
    <style>
      :root {
        --bg: #f4f8ff;
        --card: #ffffff;
        --line: #d7e3f7;
        --text: #1b2d4a;
        --muted: #5e7398;
        --brand: #1e6fea;
        --brand-soft: #eaf2ff;
        --ok: #0b8c5f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
        color: var(--text);
        background: linear-gradient(180deg, #ecf4ff 0%, var(--bg) 100%);
      }
      .app { max-width: 1180px; margin: 0 auto; padding: 18px 16px 34px; }
      .hero {
        background: linear-gradient(135deg, #307cf2 0%, #56a7ff 100%);
        color: #fff;
        border-radius: 18px;
        padding: 22px;
        box-shadow: 0 10px 25px rgba(35, 88, 175, 0.26);
      }
      .hero h1 { margin: 0; font-size: clamp(1.5rem, 2.8vw, 2rem); }

      .tabs { margin-top: 14px; display: flex; gap: 10px; }
      .tab-btn {
        border: 1px solid #bfd3f4;
        border-radius: 12px;
        background: #fff;
        color: #2e4c85;
        padding: 10px 14px;
        font-weight: 800;
        cursor: pointer;
      }
      .tab-btn.active { background: var(--brand); border-color: var(--brand); color: #fff; }

      .card {
        margin-top: 14px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 8px 18px rgba(30, 54, 112, 0.08);
      }
      .head { padding: 16px 18px 8px; display: flex; justify-content: space-between; align-items: center; }
      .head h2 { margin: 0; font-size: 1.3rem; }
      .body { padding: 12px 18px 18px; }

      .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .field { display: flex; flex-direction: column; gap: 6px; }
      .full { grid-column: 1 / -1; }
      label { color: var(--muted); font-weight: 700; font-size: 0.95rem; }
      input, select, button { font: inherit; }
      input, select {
        width: 100%;
        border: 1px solid #c8d8f2;
        border-radius: 11px;
        padding: 12px;
        font-size: 1rem;
        background: #fff;
      }
      input:focus, select:focus { outline: none; border-color: #75acff; box-shadow: 0 0 0 3px rgba(117, 172, 255, 0.2); }

      .sakura-panel {
        border: 1px dashed #bfd2f5;
        background: #f8fbff;
        border-radius: 12px;
        padding: 12px;
      }
      .actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 12px; }
      .btn {
        border: none;
        border-radius: 11px;
        padding: 11px 14px;
        font-weight: 800;
        cursor: pointer;
      }
      .btn.primary { background: var(--brand); color: #fff; }
      .btn.soft { background: var(--brand-soft); color: #35538a; }
      .btn.outline { border: 1px solid #bfd2f3; background: #fff; color: #2c4f89; }

      .result {
        margin-top: 14px;
        border: 1px solid #d2e3ff;
        border-radius: 12px;
        background: linear-gradient(135deg, #eef6ff, #f9fbff);
        padding: 14px;
      }
      .price { font-size: clamp(1.8rem, 3.6vw, 2.5rem); font-weight: 900; margin: 4px 0; color: #1b4ea8; }
      .muted { color: var(--muted); font-size: 1rem; line-height: 1.65; }
      .good { color: var(--ok); font-weight: 800; }

      .hidden { display: none; }
      .rate-meta {
        margin-bottom: 8px;
        padding: 10px 12px;
        border: 1px solid #d7e5ff;
        border-radius: 10px;
        background: #f7fbff;
        color: #375280;
        font-size: 0.95rem;
      }
      table { width: 100%; border-collapse: collapse; font-size: 1rem; }
      th, td { border-bottom: 1px solid #dde7f8; padding: 9px 7px; text-align: left; }
      th { color: #536a95; font-size: 0.9rem; letter-spacing: 0.02em; }

      dialog { width: min(1020px, calc(100% - 18px)); border: 1px solid #d9e4f7; border-radius: 14px; padding: 0; }
      dialog::backdrop { background: rgba(5, 13, 29, 0.5); }
      .modal-head { padding: 12px 14px; border-bottom: 1px solid #e2eaf7; display: flex; justify-content: space-between; align-items: center; }
      .modal-body { padding: 12px 14px 16px; max-height: 72vh; overflow: auto; }
      .item-card { border: 1px solid #d7e3f5; border-radius: 12px; background: #fbfdff; padding: 10px; margin-bottom: 10px; }
      .meta { margin-top: 8px; min-height: 1.2em; color: var(--ok); font-weight: 700; }

      @page { size: A4 portrait; margin: 12mm; }
      @media print {
        body { background: #fff; }
        .hero, .tabs, .print-hide, #calcSection { display: none !important; }
        #rateSection { display: block !important; margin: 0; border: none; box-shadow: none; }
        .card { border: none; box-shadow: none; }
        .head { padding: 0 0 4mm; }
        .head h2 { font-size: 16pt; }
        .rate-meta { margin-bottom: 4mm; font-size: 10pt; }
        table { font-size: 10.5pt; }
        th, td { padding: 2.5mm 1.8mm; }
      }
      @media (max-width: 920px) { .field-grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="hero">
        <h1>KOKO HOTEL Premier 熊本 駐車場料金ツール</h1>
      </section>

      <div class="tabs print-hide">
        <button class="tab-btn active" data-tab="calc" type="button">料金計算</button>
        <button class="tab-btn" data-tab="rate" type="button">ゲスト用レート表</button>
      </div>

      <section id="calcSection" class="card">
        <div class="head"><h2>料金計算</h2></div>
        <div class="body">
          <div class="field-grid">
            <div class="field"><label for="lotSelect">駐車場</label><select id="lotSelect"></select></div>
            <div class="field"><label for="entryInput">入庫日時</label><input id="entryInput" type="datetime-local" /></div>
            <div class="field"><label for="exitInput">出庫日時</label><input id="exitInput" type="datetime-local" /></div>
            <div class="field"><label>&nbsp;</label><button id="openSettingsBtn" class="btn outline" type="button">料金設定を開く</button></div>

            <div id="sakuraPanel" class="sakura-panel full" hidden>
              <div class="field-grid">
                <div class="field"><label for="shoppingAmount">桜町 買い物金額（円）</label><input id="shoppingAmount" type="number" min="0" value="0" /></div>
                <div class="field"><label for="serviceHours">桜町 サービス券時間（時間）</label><input id="serviceHours" type="number" min="0" step="0.5" value="0" /></div>
              </div>
            </div>
          </div>

          <div class="actions print-hide">
            <button id="calcBtn" class="btn primary" type="button">計算</button>
            <button id="clearBtn" class="btn soft" type="button">クリア</button>
          </div>

          <div class="result" aria-live="polite">
            <div class="muted">支払想定</div>
            <div id="resultPrice" class="price">¥0</div>
            <div id="resultNote" class="muted">日時を入力してください。</div>
            <div id="resultDetail" class="muted"></div>
          </div>
        </div>
      </section>

      <section id="rateSection" class="card hidden">
        <div class="head">
          <h2>ゲスト用レート表（翌日05:00から12時間）</h2>
          <button id="printBtn" class="btn outline print-hide" type="button">A4印刷</button>
        </div>
        <div class="body">
          <div class="field-grid print-hide">
            <div class="field"><label for="tableLotSelect">駐車場</label><select id="tableLotSelect"></select></div>
            <div class="field"><label for="tableEntryInput">入庫日時</label><input id="tableEntryInput" type="datetime-local" /></div>
          </div>
          <div class="actions print-hide"><button id="generateTableBtn" class="btn primary" type="button">レート表を作成</button></div>
          <div id="rateMeta" class="rate-meta">レート表を作成してください。</div>
          <table>
            <thead><tr><th>出庫時刻</th><th>曜日区分</th><th>祝日区分</th><th>通常料金</th></tr></thead>
            <tbody id="rateTableBody"><tr><td colspan="4" class="muted">まだ作成されていません。</td></tr></tbody>
          </table>
        </div>
      </section>
    </main>

    <dialog id="settingsDialog">
      <div class="modal-head"><strong>料金設定</strong><button id="closeSettingsBtn" class="btn soft" type="button">閉じる</button></div>
      <div class="modal-body">
        <h4>駐車場設定（平日/土日/祝日）</h4>
        <div id="lotSettings"></div>
        <div class="actions"><button id="addLotBtn" class="btn soft" type="button">+ 駐車場追加</button></div>

        <h4>桜町 買い物無料時間ルール</h4>
        <div id="discountSettings"></div>
        <div class="actions"><button id="addDiscountBtn" class="btn soft" type="button">+ ルール追加</button></div>

        <div class="actions">
          <button id="saveSettingsBtn" class="btn primary" type="button">設定保存</button>
          <button id="resetSettingsBtn" class="btn outline" type="button">初期値に戻す</button>
        </div>
        <div id="settingsMeta" class="meta"></div>
      </div>
    </dialog>

    <script>
      const STORAGE_KEY = "kokoParkingToolV5";
      const baseRate = (dayFee, dayMax, nightFee, nightMax) => ({ dayStart: 8, dayEnd: 20, dayUnitMin: 30, dayUnitFee: dayFee, dayMax, nightUnitMin: 60, nightUnitFee: nightFee, nightMax });
      const defaultState = {
        hotelSakuraTicket: 1800,
        sakuraDiscountRules: [
          { threshold: 3000, freeMinutes: 60 },
          { threshold: 5000, freeMinutes: 120 },
          { threshold: 10000, freeMinutes: 180 }
        ],
        lots: [
          { id: "lot-1", name: "駐車場1（桜町）", website: "https://sakuramachi-kumamoto.jp/parking", isSakura: true,
            weekday: baseRate(200, 1400, 100, 800), weekend: baseRate(240, 1600, 120, 900), holiday: baseRate(250, 1700, 130, 950) },
          { id: "lot-2", name: "駐車場2（Passurt24 唐島公園）", website: "https://passurt24.com/car_karasimakouen/", isSakura: false,
            weekday: baseRate(220, 1300, 110, 700), weekend: baseRate(250, 1500, 130, 800), holiday: baseRate(260, 1600, 140, 850) },
          { id: "lot-3", name: "駐車場3（k-c.passurt）", website: "https://k-c.passurt.com/", isSakura: false,
            weekday: baseRate(200, 1200, 100, 700), weekend: baseRate(230, 1400, 120, 800), holiday: baseRate(240, 1500, 130, 850) },
          { id: "lot-4", name: "駐車場4（NTT AP Park）", website: "https://www.ntt-ap.co.jp/personal_park/appark/hour/?pref=kumamoto", isSakura: false,
            weekday: baseRate(250, 1500, 120, 800), weekend: baseRate(280, 1700, 140, 900), holiday: baseRate(290, 1800, 150, 950) }
        ]
      };

      const byId = (id) => document.getElementById(id);
      const lotSelect = byId("lotSelect");
      const tableLotSelect = byId("tableLotSelect");
      const sakuraPanel = byId("sakuraPanel");
      const entryInput = byId("entryInput");
      const exitInput = byId("exitInput");
      const shoppingAmount = byId("shoppingAmount");
      const serviceHours = byId("serviceHours");

      function clone(v) { return JSON.parse(JSON.stringify(v)); }
      function yen(v) { return new Intl.NumberFormat("ja-JP", { style: "currency", currency: "JPY", maximumFractionDigits: 0 }).format(v); }
      function n(v, f = 0) { const x = Number(v); return Number.isFinite(x) ? x : f; }
      function pad(v) { return String(v).padStart(2, "0"); }
      function fmt(dt) { return `${dt.getMonth() + 1}/${dt.getDate()} ${pad(dt.getHours())}:${pad(dt.getMinutes())}`; }

      function nthWeekdayOfMonth(year, month, weekday, nth) {
        const first = new Date(year, month - 1, 1);
        const offset = (7 + weekday - first.getDay()) % 7;
        return 1 + offset + (nth - 1) * 7;
      }
      function springEquinoxDay(year) { return Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4)); }
      function autumnEquinoxDay(year) { return Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4)); }
      function holidaySet(year) {
        const h = new Set();
        const add = (m, d) => h.add(`${year}-${pad(m)}-${pad(d)}`);
        add(1, 1);
        add(2, 11);
        add(2, 23);
        add(4, 29);
        add(5, 3); add(5, 4); add(5, 5);
        add(8, 11);
        add(11, 3); add(11, 23);
        add(3, springEquinoxDay(year));
        add(9, autumnEquinoxDay(year));
        add(1, nthWeekdayOfMonth(year, 1, 1, 2));
        add(7, nthWeekdayOfMonth(year, 7, 1, 3));
        add(9, nthWeekdayOfMonth(year, 9, 1, 3));
        add(10, nthWeekdayOfMonth(year, 10, 1, 2));
        return h;
      }
      function dateKey(date) { return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`; }
      function isJapaneseHoliday(date) { return holidaySet(date.getFullYear()).has(dateKey(date)); }
      function dayType(date) {
        if (isJapaneseHoliday(date)) return "holiday";
        const d = date.getDay();
        return d === 0 || d === 6 ? "weekend" : "weekday";
      }
      function dayLabel(type) { return type === "weekday" ? "平日" : type === "weekend" ? "土日" : "祝日"; }

      function loadState() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return clone(defaultState);
        try {
          const p = JSON.parse(raw);
          if (!Array.isArray(p.lots) || p.lots.length === 0) return clone(defaultState);
          return p;
        } catch { return clone(defaultState); }
      }
      let state = loadState();
      function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

      function getLot(id) { return state.lots.find((l) => l.id === id); }
      function renderLots() {
        [lotSelect, tableLotSelect].forEach((sel) => {
          sel.innerHTML = "";
          state.lots.forEach((lot) => {
            const o = document.createElement("option");
            o.value = lot.id; o.textContent = lot.name; sel.appendChild(o);
          });
        });
        toggleSakura();
      }
      function toggleSakura() {
        const lot = getLot(lotSelect.value);
        sakuraPanel.hidden = !(lot && lot.isSakura);
      }

      function addCharge(obj, dayKey, period, unitMin, unitFee, cap) {
        if (!obj[dayKey]) obj[dayKey] = { dayMinutes: 0, nightMinutes: 0, day: 0, night: 0 };
        obj[dayKey][`${period}Minutes`] += 1;
        const units = Math.ceil(obj[dayKey][`${period}Minutes`] / Math.max(1, unitMin));
        obj[dayKey][period] = Math.min(units * unitFee, cap);
      }
      function calcNormalFee(lot, entry, exit) {
        const cur = new Date(entry);
        const perDay = {};
        while (cur < exit) {
          const next = new Date(Math.min(exit.getTime(), cur.getTime() + 60000));
          const type = dayType(cur);
          const r = lot[type] || lot.weekday;
          const h = cur.getHours() + cur.getMinutes() / 60;
          const isDay = h >= r.dayStart && h < r.dayEnd;
          const k = `${dateKey(cur)}-${type}`;
          if (isDay) addCharge(perDay, k, "day", r.dayUnitMin, r.dayUnitFee, r.dayMax);
          else addCharge(perDay, k, "night", r.nightUnitMin, r.nightUnitFee, r.nightMax);
          cur.setTime(next.getTime());
        }
        let total = 0; let day = 0; let night = 0;
        Object.values(perDay).forEach((v) => { total += v.day + v.night; day += v.day; night += v.night; });
        return { total, dayFee: day, nightFee: night };
      }

      function freeMinutesByShopping(amount) {
        const rules = clone(state.sakuraDiscountRules).sort((a, b) => a.threshold - b.threshold);
        let free = 0;
        rules.forEach((r) => { if (amount >= r.threshold) free = Math.max(free, r.freeMinutes); });
        return free;
      }

      function calculateMain() {
        const lot = getLot(lotSelect.value);
        const entry = new Date(entryInput.value);
        const exit = new Date(exitInput.value);
        const resultPrice = byId("resultPrice");
        const resultNote = byId("resultNote");
        const resultDetail = byId("resultDetail");

        if (!lot || !entryInput.value || !exitInput.value || Number.isNaN(entry.getTime()) || Number.isNaN(exit.getTime())) {
          resultPrice.textContent = "¥0";
          resultNote.textContent = "日時を正しく入力してください。";
          resultDetail.textContent = "";
          return;
        }
        if (exit <= entry) {
          resultPrice.textContent = "¥0";
          resultNote.textContent = "出庫は入庫より後にしてください。";
          resultDetail.textContent = "";
          return;
        }

        const normal = calcNormalFee(lot, entry, exit);
        if (!lot.isSakura) {
          resultPrice.textContent = yen(normal.total);
          resultNote.textContent = `${lot.name} の通常料金`;
          resultDetail.textContent = `日中 ${yen(normal.dayFee)} / 夜間 ${yen(normal.nightFee)}`;
          return;
        }

        const freeShop = freeMinutesByShopping(Math.max(0, n(shoppingAmount.value, 0)));
        const freeSvc = Math.round(Math.max(0, n(serviceHours.value, 0)) * 60);
        const free = freeShop + freeSvc;
        const adjEntry = new Date(entry.getTime() + free * 60000);
        const adjustedNormal = adjEntry < exit ? calcNormalFee(lot, adjEntry, exit).total : 0;
        const hotel = n(state.hotelSakuraTicket, 1800);
        const cheaper = Math.min(adjustedNormal, hotel);
        const diff = Math.abs(adjustedNormal - hotel);
        const side = adjustedNormal <= hotel ? "通常料金" : "ホテル宿泊券";

        resultPrice.textContent = yen(cheaper);
        resultNote.innerHTML = `桜町：<span class="good">${side}が安い</span>（差額 ${yen(diff)}）`;
        resultDetail.textContent = `通常料金(割引後) ${yen(adjustedNormal)} / ホテル宿泊券 ${yen(hotel)} / 買い物無料 ${freeShop}分 / サービス券 ${freeSvc}分`;
      }

      function generateRateTable() {
        const lot = getLot(tableLotSelect.value);
        const raw = byId("tableEntryInput").value;
        const tbody = byId("rateTableBody");
        const meta = byId("rateMeta");
        if (!lot || !raw) {
          tbody.innerHTML = '<tr><td colspan="4" class="muted">駐車場と入庫日時を入力してください。</td></tr>';
          return;
        }
        const entry = new Date(raw);
        const start = new Date(entry);
        start.setDate(start.getDate() + 1);
        start.setHours(5, 0, 0, 0);
        const end = new Date(start.getTime() + 12 * 60 * 60000);

        let html = "";
        for (let t = new Date(start); t <= end; t = new Date(t.getTime() + 30 * 60000)) {
          const fee = calcNormalFee(lot, entry, t).total;
          const type = dayType(t);
          html += `<tr><td>${fmt(t)}</td><td>${type === "weekday" ? "平日" : "土日"}</td><td>${type === "holiday" ? "祝日" : "-"}</td><td>${yen(fee)}</td></tr>`;
        }
        tbody.innerHTML = html;
        meta.textContent = `${lot.name} / 入庫 ${fmt(entry)} / 表示範囲: ${fmt(start)} 〜 ${fmt(end)}（30分刻み）`;
      }

      function lotField(lot, key, label, val, type = "number") {
        const min = type === "number" ? 'min="0"' : "";
        return `<div class="field"><label>${label}</label><input data-lot-id="${lot.id}" data-key="${key}" type="${type}" ${min} value="${val}" /></div>`;
      }

      function renderSettings() {
        const lotWrap = byId("lotSettings");
        const disWrap = byId("discountSettings");
        lotWrap.innerHTML = "";
        state.lots.forEach((lot) => {
          const card = document.createElement("section");
          card.className = "item-card";
          const rateFields = (name, r) => `${lotField(lot, `${name}.dayUnitFee`, `${name} 日中単位料金`, r.dayUnitFee)}${lotField(lot, `${name}.dayMax`, `${name} 日中打ち止め`, r.dayMax)}${lotField(lot, `${name}.nightUnitFee`, `${name} 夜間単位料金`, r.nightUnitFee)}${lotField(lot, `${name}.nightMax`, `${name} 夜間打ち止め`, r.nightMax)}`;
          card.innerHTML = `
            <div class="field-grid">
              ${lotField(lot, "name", "駐車場名", lot.name, "text")}
              ${lotField(lot, "website", "URL", lot.website, "text")}
              ${lotField(lot, "isSakura", "桜町判定(1/0)", lot.isSakura ? 1 : 0)}
              ${rateFields("weekday", lot.weekday)}
              ${rateFields("weekend", lot.weekend)}
              ${rateFields("holiday", lot.holiday)}
            </div>
            <div class="actions"><button class="btn soft" data-remove-lot="${lot.id}" type="button">この駐車場を削除</button></div>
          `;
          lotWrap.appendChild(card);
        });

        disWrap.innerHTML = state.sakuraDiscountRules
          .sort((a, b) => a.threshold - b.threshold)
          .map((r, i) => `
            <section class="item-card">
              <div class="field-grid">
                <div class="field"><label>買い物金額以上(円)</label><input data-rule-idx="${i}" data-key="threshold" type="number" min="0" value="${r.threshold}" /></div>
                <div class="field"><label>無料時間(分)</label><input data-rule-idx="${i}" data-key="freeMinutes" type="number" min="0" value="${r.freeMinutes}" /></div>
              </div>
              <div class="actions"><button class="btn soft" data-remove-rule="${i}" type="button">このルールを削除</button></div>
            </section>
          `).join("");
      }

      function setPath(obj, path, val) {
        const keys = path.split(".");
        let ref = obj;
        for (let i = 0; i < keys.length - 1; i++) ref = ref[keys[i]];
        ref[keys[keys.length - 1]] = val;
      }

      function saveSettings() {
        const next = clone(state);
        document.querySelectorAll("input[data-lot-id]").forEach((el) => {
          const lot = next.lots.find((l) => l.id === el.dataset.lotId);
          if (!lot) return;
          const key = el.dataset.key;
          if (key === "name" || key === "website") setPath(lot, key, el.value.trim());
          else if (key === "isSakura") lot.isSakura = n(el.value, 0) === 1;
          else setPath(lot, key, Math.max(0, n(el.value, 0)));
        });

        next.sakuraDiscountRules = [];
        document.querySelectorAll("input[data-rule-idx]").forEach((el) => {
          const idx = Number(el.dataset.ruleIdx);
          if (!next.sakuraDiscountRules[idx]) next.sakuraDiscountRules[idx] = { threshold: 0, freeMinutes: 0 };
          next.sakuraDiscountRules[idx][el.dataset.key] = Math.max(0, n(el.value, 0));
        });
        next.sakuraDiscountRules = next.sakuraDiscountRules.filter(Boolean);

        next.lots = next.lots.filter((l) => l.name);
        if (!next.lots.length) { byId("settingsMeta").textContent = "駐車場は1件以上必要です。"; return; }

        state = next;
        saveState();
        renderLots();
        byId("settingsMeta").textContent = "設定を保存しました。";
      }

      function newLot() {
        return {
          id: `lot-${Date.now()}`,
          name: "新しい駐車場",
          website: "",
          isSakura: false,
          weekday: baseRate(200, 1200, 100, 700),
          weekend: baseRate(230, 1400, 120, 800),
          holiday: baseRate(240, 1500, 130, 850)
        };
      }

      function bindEvents() {
        document.querySelectorAll(".tab-btn").forEach((b) => {
          b.addEventListener("click", () => {
            document.querySelectorAll(".tab-btn").forEach((x) => x.classList.remove("active"));
            b.classList.add("active");
            byId("calcSection").classList.toggle("hidden", b.dataset.tab !== "calc");
            byId("rateSection").classList.toggle("hidden", b.dataset.tab !== "rate");
          });
        });

        lotSelect.addEventListener("change", toggleSakura);
        byId("calcBtn").addEventListener("click", calculateMain);
        byId("clearBtn").addEventListener("click", () => {
          entryInput.value = ""; exitInput.value = ""; shoppingAmount.value = "0"; serviceHours.value = "0";
          byId("resultPrice").textContent = "¥0"; byId("resultNote").textContent = "日時を入力してください。"; byId("resultDetail").textContent = "";
        });

        byId("generateTableBtn").addEventListener("click", generateRateTable);
        byId("printBtn").addEventListener("click", () => window.print());

        byId("openSettingsBtn").addEventListener("click", () => { byId("settingsMeta").textContent = ""; renderSettings(); byId("settingsDialog").showModal(); });
        byId("closeSettingsBtn").addEventListener("click", () => byId("settingsDialog").close());
        byId("addLotBtn").addEventListener("click", () => { state.lots.push(newLot()); renderSettings(); });
        byId("addDiscountBtn").addEventListener("click", () => { state.sakuraDiscountRules.push({ threshold: 0, freeMinutes: 0 }); renderSettings(); });
        byId("saveSettingsBtn").addEventListener("click", saveSettings);
        byId("resetSettingsBtn").addEventListener("click", () => { state = clone(defaultState); saveState(); renderLots(); renderSettings(); byId("settingsMeta").textContent = "初期値に戻しました。"; });

        byId("lotSettings").addEventListener("click", (e) => {
          const id = e.target.dataset.removeLot;
          if (!id) return;
          if (state.lots.length <= 1) { byId("settingsMeta").textContent = "最後の1件は削除できません。"; return; }
          state.lots = state.lots.filter((l) => l.id !== id);
          renderSettings();
        });
        byId("discountSettings").addEventListener("click", (e) => {
          const idx = e.target.dataset.removeRule;
          if (idx === undefined) return;
          state.sakuraDiscountRules.splice(Number(idx), 1);
          renderSettings();
        });
      }

      renderLots();
      bindEvents();
    </script>
  </body>
</html>
